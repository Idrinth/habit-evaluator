plugins {
    id 'com.android.application' version '8.2.1'
}

android {
    namespace 'de.idrinth.habitevaluator.android'
    compileSdk 35

    defaultConfig {
        applicationId "de.idrinth.habitevaluator.android"
        minSdk 26
        targetSdk 35
        versionCode (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName project.version.toString().replace('-SNAPSHOT', '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation project(':shared')

    // Jakarta Persistence API to resolve shared module's JPA annotations at compile time
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // SLF4J no-op implementation to prevent service lookup failures on Android
    implementation 'org.slf4j:slf4j-nop:2.0.11'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
