plugins {
    id 'com.android.application' version '8.9.0'
    id 'jacoco'
}

android {
    namespace 'de.idrinth.habitevaluator.android'
    compileSdk 35

    defaultConfig {
        applicationId "de.idrinth.habitevaluator.android"
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = project.version.toString().replace('-SNAPSHOT', '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "apiLevel"
    productFlavors {
        legacy {
            dimension "apiLevel"
            minSdk 21
            versionNameSuffix "-legacy"
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 21
        }
        modern {
            dimension "apiLevel"
            minSdk 26
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 26
        }
    }

    signingConfigs {
        release {
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.all {
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation project(':shared')

    // Jakarta Persistence API to resolve shared module's JPA annotations at compile time
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // SLF4J no-op implementation to prevent service lookup failures on Android
    implementation 'org.slf4j:slf4j-nop:2.0.17'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

jacoco {
    toolVersion = '0.8.11'
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testModernDebugUnitTest', 'testLegacyDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
    ]

    def modernDebugTree = fileTree(
        dir: layout.buildDirectory.dir("intermediates/javac/modernDebug/classes"),
        excludes: fileFilter
    )
    def legacyDebugTree = fileTree(
        dir: layout.buildDirectory.dir("intermediates/javac/legacyDebug/classes"),
        excludes: fileFilter
    )

    classDirectories.setFrom(modernDebugTree + legacyDebugTree)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(layout.buildDirectory.files(
        'jacoco/testModernDebugUnitTest.exec',
        'jacoco/testLegacyDebugUnitTest.exec'
    ))
}
