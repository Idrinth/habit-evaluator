plugins {
    id 'com.android.application' version '9.0.1'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0'
    id 'com.google.devtools.ksp' version '2.3.5'
    id 'androidx.room' version '2.8.4'
    id 'jacoco'
}

android {
    namespace 'de.idrinth.habitevaluator.android'
    compileSdk 36

    defaultConfig {
        applicationId "de.idrinth.habitevaluator.android"
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = project.version.toString().replace('-SNAPSHOT', '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "apiLevel"
    productFlavors {
        lollipop {
            dimension "apiLevel"
            minSdk 23
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 21
        }
        oreo {
            dimension "apiLevel"
            minSdk 26
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 26
        }
        tiramisu {
            dimension "apiLevel"
            minSdk 33
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 33
        }
    }

    signingConfigs {
        release {
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testCoverage {
        jacocoVersion = '0.8.13'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        unitTests.returnDefaultValues = true
    }
}

room {
    schemaDirectory("$projectDir/schemas")
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation project(':shared')

    // Jakarta Persistence API to resolve shared module's JPA annotations at compile time
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // SLF4J no-op implementation to prevent service lookup failures on Android
    implementation 'org.slf4j:slf4j-nop:2.0.17'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Jetpack Compose (BOM)
    def composeBom = platform('androidx.compose:compose-bom:2026.01.01')
    implementation composeBom
    testImplementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Activity & Navigation Compose
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.navigation:navigation-compose:2.9.7'

    // Lifecycle (ViewModel + Compose)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'

    // Room
    implementation 'androidx.room:room-runtime:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    // AndroidX (kept for AppCompat locale/theme, Material XML theme, DocumentFile SAF backup)
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.11.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    testImplementation 'androidx.room:room-testing:2.8.4'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

jacoco {
    toolVersion = '0.8.13'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.excludes.add('**/databinding/**')
    }
}

tasks.withType(Test).configureEach {
    outputs.cacheIf { false }
}

tasks.register('jacocoTestReport', JacocoReport) {
    mustRunAfter 'testLollipopDebugUnitTest', 'testOreoDebugUnitTest', 'testTiramisuDebugUnitTest'
    outputs.cacheIf { false }

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/databinding/**'
    ]

    classDirectories.setFrom(files(
        fileTree(
            dir: layout.buildDirectory.dir("intermediates/built_in_kotlinc/oreoDebug/compileOreoDebugKotlin/classes"),
            excludes: fileFilter
        )
    ))
    sourceDirectories.setFrom(files('src/main/kotlin'))
    executionData.setFrom(fileTree(
        dir: layout.buildDirectory,
        includes: ['**/*.exec']
    ))
}

