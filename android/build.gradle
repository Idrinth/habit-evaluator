plugins {
    id 'com.android.application' version '9.0.1'
    id 'jacoco'
}

android {
    namespace 'de.idrinth.habitevaluator.android'
    compileSdk 35

    defaultConfig {
        applicationId "de.idrinth.habitevaluator.android"
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName = project.version.toString().replace('-SNAPSHOT', '')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions "apiLevel"
    productFlavors {
        lollipop {
            dimension "apiLevel"
            minSdk 21
            versionNameSuffix "-lollipop"
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 21
        }
        oreo {
            dimension "apiLevel"
            minSdk 26
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 26
        }
        tiramisu {
            dimension "apiLevel"
            minSdk 33
            versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger() * 100 + 33
        }
    }

    signingConfigs {
        release {
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (keystoreFilePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testCoverage {
        jacocoVersion = '0.8.13'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation project(':shared')

    // Jakarta Persistence API to resolve shared module's JPA annotations at compile time
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // SLF4J no-op implementation to prevent service lookup failures on Android
    implementation 'org.slf4j:slf4j-nop:2.0.17'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // JaCoCo agent runtime for Maestro coverage collection in debug builds
    debugImplementation 'org.jacoco:org.jacoco.agent:0.8.13:runtime'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

jacoco {
    toolVersion = '0.8.13'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.excludes.add('**/databinding/**')
        variant.instrumentation.excludes.add('**/coverage/**')
    }
}

tasks.withType(Test).configureEach {
    outputs.cacheIf { false }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testLollipopDebugUnitTest', 'testOreoDebugUnitTest', 'testTiramisuDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/databinding/**'
    ]

    def debugTree = fileTree(
        dir: layout.buildDirectory.dir("intermediates/javac/tiramisuDebug/compileTiramisuDebugJavaWithJavac/classes"),
        excludes: fileFilter
    )

    classDirectories.setFrom(debugTree)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(fileTree(
        dir: layout.buildDirectory,
        includes: [
            'jacoco/testLollipopDebugUnitTest.exec',
            'jacoco/testOreoDebugUnitTest.exec',
            'jacoco/testTiramisuDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/lollipopDebugUnitTest/testLollipopDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/oreoDebugUnitTest/testOreoDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/tiramisuDebugUnitTest/testTiramisuDebugUnitTest.exec'
        ]
    ))
}

tasks.register('jacocoMaestroReport', JacocoReport) {
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/coverage/**/*.*',
        '**/databinding/**'
    ]

    // Use the original (non-instrumented) classes saved before offline
    // instrumentation.  JaCoCo computes class IDs (CRC64) from the bytecode
    // of the classes provided here and matches them against the IDs recorded
    // in the execution data.  Instrumented bytecode has different CRC64
    // hashes, so using instrumented classes would silently produce 0% coverage.
    def debugTree = fileTree(
        dir: layout.buildDirectory.dir("maestro-original-classes"),
        excludes: fileFilter
    )

    classDirectories.setFrom(debugTree)
    sourceDirectories.setFrom(files('src/main/java'))
    executionData.setFrom(
        fileTree(
            dir: layout.buildDirectory.dir("maestro-coverage"),
            includes: ['**/*.ec']
        ).filter { file ->
            // Validate JaCoCo execution data magic bytes (0x01 0xC0 0xC0)
            if (file.length() < 5) return false
            def stream = file.newInputStream()
            try {
                return stream.read() == 0x01 && stream.read() == 0xC0 && stream.read() == 0xC0
            } catch (Exception ignored) {
                return false
            } finally {
                stream.close()
            }
        }
    )
}

// JaCoCo offline instrumentation for Maestro coverage collection.
// AGP's enableAndroidTestCoverage only instruments for connectedAndroidTest,
// not for assembleDebug. Maestro installs the regular debug APK, so we must
// instrument the compiled bytecode explicitly.
// Guarded by -PmaestroCoverage to avoid interfering with unit test coverage
// which AGP instruments separately.
//
// The instrumentation is a standalone task (not a doLast on the compile task)
// because Gradle's build cache skips all task actions — including doLast — on
// cache hits.  A doLast hook that modifies compile output would silently be
// skipped when the compile task is restored from cache, producing an APK with
// no JaCoCo probes (causing NO_CLASS at coverage collection time).
//
// Uses androidComponents.onVariants (AGP 9+) instead of the removed
// applicationVariants API.  Variant names are collected during configuration,
// then afterEvaluate registers instrumentation tasks and wires them into the
// build pipeline once all AGP tasks exist.
if (project.hasProperty('maestroCoverage')) {
    def debugVariantNames = []

    androidComponents {
        onVariants(selector().withBuildType("debug")) { variant ->
            debugVariantNames.add(variant.name)
        }
    }

    afterEvaluate {
        debugVariantNames.each { variantName ->
            def variantCapName = variantName.capitalize()
            def compileTaskName = "compile${variantCapName}JavaWithJavac"
            def compileTask = tasks.named(compileTaskName, JavaCompile)
            def classesDir = compileTask.flatMap { it.destinationDirectory }
            def originalClassesDir = layout.buildDirectory.dir("maestro-original-classes")

            def instrumentTask = tasks.register("jacocoOfflineInstrument${variantCapName}") {
                description = "Applies JaCoCo offline instrumentation to ${variantName} classes for Maestro coverage"
                group = 'verification'

                dependsOn compileTask
                inputs.dir(classesDir)
                outputs.dir(originalClassesDir)
                // Never cache: the task modifies the compile output in-place,
                // so restoring cached outputs would not re-apply the in-place
                // changes to the current compile output.
                outputs.cacheIf { false }

                doLast {
                    def classesDirFile = classesDir.get().asFile
                    if (!classesDirFile.exists()) {
                        return
                    }

                    // Save original (non-instrumented) classes before instrumenting.
                    // JaCoCo report generation requires the original bytecode to match
                    // class IDs (CRC64) stored in the execution data.  The instrumented
                    // bytecode has different CRC64 hashes, so providing instrumented
                    // classes to the report task causes silent 0% coverage.
                    def origDir = originalClassesDir.get().asFile
                    if (origDir.exists()) {
                        project.delete(origDir)
                    }
                    project.copy {
                        from classesDirFile
                        into origDir
                    }

                    def tempDir = new File(classesDirFile.parentFile, classesDirFile.name + '-jacoco-instrumented')

                    ant.taskdef(
                        name: 'instrument',
                        classname: 'org.jacoco.ant.InstrumentTask',
                        classpath: configurations.jacocoAnt.asPath
                    )

                    if (tempDir.exists()) {
                        project.delete(tempDir)
                    }

                    ant.instrument(destdir: tempDir) {
                        fileset(dir: classesDirFile, includes: '**/*.class', excludes: '**/databinding/**,**/coverage/**,**/module-info.class,**/package-info.class')
                    }

                    def instrumentedCount = 0
                    tempDir.eachFileRecurse { if (it.name.endsWith('.class')) instrumentedCount++ }

                    if (instrumentedCount == 0) {
                        logger.warn("JaCoCo offline instrumentation produced no instrumented classes for ${variantName}")
                    }

                    project.copy {
                        from tempDir
                        into classesDirFile
                    }
                    project.delete(tempDir)

                    logger.lifecycle("JaCoCo offline instrumentation applied to ${variantName} classes (${instrumentedCount} files)")
                }
            }

            // Wire the instrumentation task into AGP's pipeline: every task that
            // consumes compiled classes (dex, merge, package) must wait for
            // instrumentation to finish.
            tasks.configureEach { task ->
                if (task.name != instrumentTask.name &&
                    task.name != compileTaskName &&
                    task.taskDependencies.getDependencies(task).any { it.name == compileTaskName }) {
                    task.dependsOn(instrumentTask)
                }
            }
        }
    }
}
