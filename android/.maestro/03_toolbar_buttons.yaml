appId: de.idrinth.habitevaluator.android
name: "Toolbar buttons navigate to Stats, Settings, and Imprint"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"
- extendedWaitUntil:
    visible:
        id: "addHabitButton"
    timeout: 5000

# Stats page via toolbar button
- waitForAnimationToEnd
- tapOn:
    id: "statsButton"
- extendedWaitUntil:
    visible:
        id: "statsTitle"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "exportPdfButton"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 50
- assertVisible:
    id: "exportPdfButton"

# Settings page via toolbar button
- tapOn:
    id: "settingsButton"
- extendedWaitUntil:
    visible:
        text: "Storage Settings"
    timeout: 5000
- assertVisible: "Theme Settings"
- scrollUntilVisible:
    element:
      text: "Save Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Save Settings"

# Imprint page via toolbar button
- tapOn:
    id: "imprintButton"
- extendedWaitUntil:
    visible:
        text: "Project legal"
    timeout: 5000
- assertVisible: "License"
- assertVisible: "Data Protection"
