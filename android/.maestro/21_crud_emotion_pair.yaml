appId: de.idrinth.habitevaluator.android
name: "Add, display and delete an emotion pair"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Emotions tab
- tapOn: "Emotions"
- extendedWaitUntil:
    visible:
        id: "emotionalStateTitle"
    timeout: 5000

# Tap add emotion pair button
- tapOn:
    id: "addEmotionPairButton"
- extendedWaitUntil:
    visible:
        text: "Add Emotion Pair"
    timeout: 5000

# Fill negative label (required)
- tapOn:
    id: "negativeLabelInput"
- inputText: "Sad"
- hideKeyboard

# Fill positive label (required)
- tapOn:
    id: "positiveLabelInput"
- inputText: "Happy"
- hideKeyboard

# Submit
- tapOn:
    id: "saveEmotionPairButton"

# After saving, navigates back to Emotions page
# Wait for the pair to appear in the list
- scrollUntilVisible:
    element:
      text: "Sad"
    direction: DOWN
    timeout: 10000

# Delete the emotion pair (has confirmation dialog)
- tapOn:
    id: "deleteEmotionPairButton"
- assertVisible: "Delete Emotion Pair"
- tapOn: "OK"

# Verify pair is removed
- assertNotVisible: "Sad"
