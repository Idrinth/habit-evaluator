appId: de.idrinth.habitevaluator.android
name: "Add, display and delete an emotion entry"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# First, create an emotion pair (prerequisite)
- tapOn: "Emotions"
- extendedWaitUntil:
    visible:
        id: "addEmotionPairButton"
    timeout: 5000
- tapOn:
    id: "addEmotionPairButton"
- extendedWaitUntil:
    visible:
        text: "Add Emotion Pair"
    timeout: 5000
- tapOn:
    id: "negativeLabelInput"
- inputText: "Anxious"
- hideKeyboard
- tapOn:
    id: "positiveLabelInput"
- inputText: "Calm"
- hideKeyboard
- tapOn:
    id: "saveEmotionPairButton"

# After saving, navigates back to Emotions page
- scrollUntilVisible:
    element:
      text: "Anxious"
    direction: DOWN
    timeout: 10000

# Tap add emotion entry button on the pair
- tapOn:
    id: "addEmotionEntryButton"

# Now on Record Emotion page
- extendedWaitUntil:
    visible:
        text: "Record Emotion"
    timeout: 5000

# Slider defaults to 0 (neutral), just tap Record
- tapOn:
    id: "recordEmotionButton"

# After recording, navigates back to Emotions page
# Expand entries for the pair
- extendedWaitUntil:
    visible:
        id: "expandCollapseButton"
    timeout: 5000
- tapOn:
    id: "expandCollapseButton"

# Verify emotion entry delete button is visible (entry exists)
- extendedWaitUntil:
    visible:
        id: "deleteEmotionEntryButton"
    timeout: 5000

# Delete the emotion entry (has confirmation dialog)
- tapOn:
    id: "deleteEmotionEntryButton"
- extendedWaitUntil:
    visible:
        text: "Delete Emotion Entry"
    timeout: 5000
- tapOn: "OK"

# Verify entry is removed
- assertNotVisible:
    id: "deleteEmotionEntryButton"
