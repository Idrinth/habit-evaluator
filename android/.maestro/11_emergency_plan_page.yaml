appId: de.idrinth.habitevaluator.android
name: "Emergency Plan page renders correctly"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Emergency tab
- tapOn: "Emergency"
- extendedWaitUntil:
    visible:
        text: "Emergency Plan"
    timeout: 5000

# Verify page content
- assertVisible:
    id: "stepsRecyclerView"
- assertVisible:
    id: "toggleFormButton"

# Expand the add step form
- tapOn:
    id: "toggleFormButton"
- extendedWaitUntil:
    visible:
        id: "questionInput"
    timeout: 5000
- assertVisible: "Add Step"
