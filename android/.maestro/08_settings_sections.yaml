appId: de.idrinth.habitevaluator.android
name: "Settings page renders all sections"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Settings
- tapOn:
    id: "settingsButton"

# Verify storage section
- assertVisible: "Storage Settings"
- assertVisible: "Local (on device)"

# Verify theme section
- assertVisible: "Theme Settings"
- assertVisible: "System default"

# Verify language section
- assertVisible: "Language Settings"

# Scroll down to see more sections
- scrollUntilVisible:
    element:
      text: "Font Size Settings"
    direction: DOWN
    timeout: 5000

# Verify font size section
- assertVisible: "Font Size Settings"

# Scroll to module visibility
- scrollUntilVisible:
    element:
      text: "Module Visibility"
    direction: DOWN
    timeout: 5000
- assertVisible: "Module Visibility"

# Scroll to reminder settings
- scrollUntilVisible:
    element:
      text: "Reminder Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Reminder Settings"

# Scroll to backup settings
- scrollUntilVisible:
    element:
      text: "Backup Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Backup Settings"

# Scroll to save button
- scrollUntilVisible:
    element:
      text: "Save Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Save Settings"
