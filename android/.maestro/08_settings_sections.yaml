appId: de.idrinth.habitevaluator.android
name: "Settings page renders all sections"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"
- extendedWaitUntil:
    visible:
        id: "addHabitButton"
    timeout: 5000

# Navigate to Settings
- tapOn:
    id: "settingsButton"
- extendedWaitUntil:
    visible:
        text: "Storage Settings"
    timeout: 5000

# Verify storage section
- assertVisible: "Local (on device)"

# Verify theme section
- assertVisible: "Theme Settings"
- assertVisible: "System default"

# Scroll to language section
- scrollUntilVisible:
    element:
      text: "Language Settings"
    direction: DOWN
    timeout: 5000

# Verify language section
- assertVisible: "Language Settings"

# Scroll down to see more sections
- scrollUntilVisible:
    element:
      text: "Font Size Settings"
    direction: DOWN
    timeout: 5000

# Verify font size section
- assertVisible: "Font Size Settings"

# Scroll to module visibility (needs more time due to font size radio group and translation settings above)
- scrollUntilVisible:
    element:
      text: "Module Visibility"
    direction: DOWN
    timeout: 10000
    speed: 60
- assertVisible: "Module Visibility"

# Scroll to reminder settings (needs more time due to 10 module visibility switches above)
- scrollUntilVisible:
    element:
      text: "Reminder Settings"
    direction: DOWN
    timeout: 15000
    speed: 60
- assertVisible: "Reminder Settings"

# Scroll to backup settings
- scrollUntilVisible:
    element:
      text: "Backup Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Backup Settings"

# Scroll to save button
- scrollUntilVisible:
    element:
      text: "Save Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Save Settings"
