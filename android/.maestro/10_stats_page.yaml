appId: de.idrinth.habitevaluator.android
name: "Stats page renders charts"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Stats
- tapOn:
    id: "statsButton"
- extendedWaitUntil:
    visible:
        id: "habitPointsChart"
    timeout: 5000

# Verify chart sections exist
- assertVisible:
    id: "habitPointsChart"
- assertVisible:
    id: "diaryPointsChart"

# Scroll to sleep charts
- scrollUntilVisible:
    element:
      id: "sleepDurationChart"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "sleepDurationChart"

# Scroll to Export PDF button
- scrollUntilVisible:
    element:
      id: "exportPdfButton"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 50
- assertVisible:
    id: "exportPdfButton"
