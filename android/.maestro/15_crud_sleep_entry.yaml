appId: de.idrinth.habitevaluator.android
name: "Add, display and delete a sleep entry"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Sleep tab
- tapOn:
    text: "Sleep"
    index: 0
- extendedWaitUntil:
    visible:
        text: "Sleep Tracking"
    timeout: 5000

# Verify page content

# Date auto-fills with today
# Fill from time (direct text input, no picker)
- tapOn:
    id: "sleepFromInput"
- inputText: "22:00"

# Fill until time
- tapOn:
    id: "sleepUntilInput"
- inputText: "07:00"
- hideKeyboard

# Submit the entry
- tapOn:
    id: "addSleepEntryButton"

# Wait for the entry to appear in the list
- extendedWaitUntil:
    visible:
        id: "sleepEntryDeleteButton"
    timeout: 5000

# Scroll to Recent Entries section and verify
- scrollUntilVisible:
    element:
      text: "22:00"
    direction: DOWN
    timeout: 10000
- assertVisible: "22:00"

# Delete the entry
- tapOn:
    id: "sleepEntryDeleteButton"

# Verify entry is removed (no delete button visible means no entries)
- assertNotVisible:
    id: "sleepEntryDeleteButton"
