appId: de.idrinth.habitevaluator.android
name: "Diary navigation cards lead to sub-pages"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Diary tab
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        text: "Positive Events"
    timeout: 5000

# Positive Events sub-page
- tapOn:
    id: "positivityDiaryCard"
- extendedWaitUntil:
    visible:
        id: "diaryEntriesRecyclerView"
    timeout: 10000
- assertVisible: "Positive Events"

# Back to Diary hub
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Sport Log sub-page
- tapOn:
    id: "sportLogCard"
- extendedWaitUntil:
    visible:
        text: "Sport Log"
    timeout: 5000

# Back to Diary hub
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Food Log sub-page
- tapOn:
    id: "foodLogCard"
- extendedWaitUntil:
    visible:
        text: "Food Log"
    timeout: 5000

# Back to Diary hub
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Medication Log sub-page
- tapOn:
    id: "medicationLogCard"
- extendedWaitUntil:
    visible:
        text: "Medication Log"
    timeout: 5000

# Back to Diary hub
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Medication List sub-page
- scrollUntilVisible:
    element:
      id: "medicationListCard"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "medicationListCard"
- extendedWaitUntil:
    visible:
        text: "Your Medications"
    timeout: 5000

# Back to Diary hub
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Activity Log sub-page
- scrollUntilVisible:
    element:
      id: "activityLogCard"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "activityLogCard"
- extendedWaitUntil:
    visible:
        text: "Activity Log"
    timeout: 5000
