appId: de.idrinth.habitevaluator.android
name: "Add, display and delete a medication log entry"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# First, create a medication (prerequisite)
- tapOn: "Diary"
- scrollUntilVisible:
    element:
      id: "medicationListCard"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "medicationListCard"

# Wait for MedicationListFragment to load
- scrollUntilVisible:
    element:
      id: "toggleFormButton"
    direction: DOWN
    timeout: 10000

# Expand add medication form
- tapOn:
    id: "toggleFormButton"

- scrollUntilVisible:
    element:
      id: "newMedicationNameInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "newMedicationNameInput"
- inputText: "TestMedication"
- hideKeyboard

# Scroll to and tap add button
- scrollUntilVisible:
    element:
      id: "addMedicationButton"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "addMedicationButton"

# Verify medication was created
- scrollUntilVisible:
    element:
      text: "TestMedication"
    direction: DOWN
    timeout: 5000

# Navigate back to Diary hub
- tapOn: "Diary"

# Navigate to Medication Log
- scrollUntilVisible:
    element:
      id: "medicationLogCard"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "medicationLogCard"

# Wait for MedicationLogFragment to load
- scrollUntilVisible:
    element:
      id: "toggleFormButton"
    direction: DOWN
    timeout: 10000

# Expand add entry form
- tapOn:
    id: "toggleFormButton"

# Medication spinner auto-selects the first medication (TestMedication)
# Fill amount (required)
- scrollUntilVisible:
    element:
      id: "medicationAmountInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "medicationAmountInput"
- inputText: "500"
- hideKeyboard

# Date and time auto-fill with current datetime
# Scroll to and tap submit button
- scrollUntilVisible:
    element:
      id: "addMedicationLogButton"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "addMedicationLogButton"

# Verify entry appears in the list
- scrollUntilVisible:
    element:
      id: "medicationLogDeleteButton"
    direction: DOWN
    timeout: 5000
- assertVisible:
    id: "medicationLogDeleteButton"

# Delete the entry
- tapOn:
    id: "medicationLogDeleteButton"

# Verify entry is removed
- assertNotVisible:
    id: "medicationLogDeleteButton"
