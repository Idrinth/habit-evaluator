appId: de.idrinth.habitevaluator.android
name: "Add Habit page is reachable"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Home tab should show Add Habit button
- assertVisible: "Home"
- assertVisible:
    id: "addHabitButton"
- tapOn:
    id: "addHabitButton"
- extendedWaitUntil:
    visible:
        id: "habitNameInput"
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Add Habit"
    timeout: 10000
- assertVisible:
    id: "habitNameInput"
