appId: de.idrinth.habitevaluator.android
name: "Bottom navigation tabs are reachable"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Home tab (default)
- assertVisible: "Home"

# Diary tab
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        text: "Positive Events"
    timeout: 5000
- assertVisible: "Sport Log"
- assertVisible: "Food Log"
- assertVisible: "Medication Log"
- scrollUntilVisible:
    element:
      text: "Your Medications"

# Sleep tab
- tapOn:
    text: "Sleep"
    index: 0
- extendedWaitUntil:
    visible:
        text: "Sleep Tracking"
    timeout: 5000

# Emergency tab
- tapOn: "Emergency"
- extendedWaitUntil:
    visible:
        text: "Emergency Plan"
    timeout: 5000

# Emotions tab
- tapOn: "Emotions"
- extendedWaitUntil:
    visible:
        id: "emotionalStateTitle"
    timeout: 5000

# Back to Home
- tapOn: "Home"
- extendedWaitUntil:
    visible:
        text: "Home"
    timeout: 5000
