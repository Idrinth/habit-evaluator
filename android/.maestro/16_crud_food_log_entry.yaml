appId: de.idrinth.habitevaluator.android
name: "Add, display and delete a food log entry"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Diary > Food Log
- tapOn: "Diary"
- tapOn:
    id: "foodLogCard"

# Wait for FoodLogFragment to load (toggleFormButton is unique to food log page)
- scrollUntilVisible:
    element:
      id: "toggleFormButton"
    direction: DOWN
    timeout: 10000

# Expand add entry form
- tapOn:
    id: "toggleFormButton"

# Fill food items (required)
- scrollUntilVisible:
    element:
      id: "foodItemsInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "foodItemsInput"
- inputText: "Rice, Chicken"
- hideKeyboard

# Fill kcal (required)
- scrollUntilVisible:
    element:
      id: "kcalInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "kcalInput"
- inputText: "500"
- hideKeyboard

# Date and time auto-fill with current datetime
# Scroll to and tap submit button
- scrollUntilVisible:
    element:
      id: "addFoodLogButton"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "addFoodLogButton"

# Verify entry appears in the list
- scrollUntilVisible:
    element:
      text: "Rice"
    direction: DOWN
    timeout: 5000
- assertVisible: "Rice"

# Delete the entry
- tapOn:
    id: "foodLogDeleteButton"

# Verify entry is removed
- assertNotVisible: "Rice, Chicken"
