appId: de.idrinth.habitevaluator.android
name: "Add, display and delete a food log entry"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Diary > Food Log
- tapOn: "Diary"
- tapOn:
    id: "foodLogCard"
- assertVisible: "Food Log"

# Expand add entry form
- tapOn:
    id: "toggleFormButton"

# Fill food items (required)
- tapOn:
    id: "foodItemsInput"
- inputText: "Rice, Chicken"
- hideKeyboard

# Fill kcal (required)
- tapOn:
    id: "kcalInput"
- inputText: "500"
- hideKeyboard

# Date and time auto-fill with current datetime
# Submit the entry
- tapOn:
    id: "addFoodLogButton"

# Verify entry appears in the list
- scrollUntilVisible:
    element:
      text: "Rice"
    direction: DOWN
    timeout: 5000
- assertVisible: "Rice"

# Delete the entry
- tapOn:
    id: "foodLogDeleteButton"

# Verify entry is removed
- assertNotVisible: "Rice, Chicken"
