appId: de.idrinth.habitevaluator.android
name: "Complete navigation flow through all pages without crash"
---
- launchApp:
    clearState: true

# Dismiss first-start dialog
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# === Bottom Navigation Tabs ===

# Home (default)
- assertVisible: "Home"
- assertVisible:
    id: "addHabitButton"

# Diary hub
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        text: "Positive Events"
    timeout: 5000
- assertVisible: "Sport Log"
- assertVisible: "Food Log"
- assertVisible: "Medication Log"
- scrollUntilVisible:
    element:
      text: "Your Medications"

# Sleep
- tapOn:
    text: "Sleep"
    index: 0
- extendedWaitUntil:
    visible:
        text: "Sleep Tracking"
    timeout: 5000

# Emergency
- tapOn: "Emergency"
- extendedWaitUntil:
    visible:
        text: "Emergency Plan"
    timeout: 5000

# Emotions
- tapOn: "Emotions"
- extendedWaitUntil:
    visible:
        id: "emotionalStateTitle"
    timeout: 5000

# === Toolbar Buttons ===

# Stats
- tapOn:
    id: "statsButton"
- extendedWaitUntil:
    visible:
        id: "habitPointsChart"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "exportPdfButton"
    direction: DOWN
    speed: 60
    timeout: 10000
    visibilityPercentage: 50
- assertVisible:
    id: "exportPdfButton"

# Settings
- tapOn:
    id: "settingsButton"
- extendedWaitUntil:
    visible:
        text: "Storage Settings"
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Save Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Save Settings"

# Imprint
- tapOn:
    id: "imprintButton"
- extendedWaitUntil:
    visible:
        text: "Project legal"
    timeout: 5000

# === Diary Sub-Pages ===

# Go to Diary hub first
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Positive Events
- tapOn:
    id: "positivityDiaryCard"
- extendedWaitUntil:
    visible:
        text: "Positive Events"
    timeout: 5000
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Sport Log
- tapOn:
    id: "sportLogCard"
- extendedWaitUntil:
    visible:
        text: "Sport Log"
    timeout: 5000
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Food Log
- tapOn:
    id: "foodLogCard"
- extendedWaitUntil:
    visible:
        text: "Food Log"
    timeout: 5000
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Medication Log
- tapOn:
    id: "medicationLogCard"
- extendedWaitUntil:
    visible:
        text: "Medication Log"
    timeout: 5000
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "positivityDiaryCard"
    timeout: 5000

# Medication List
- scrollUntilVisible:
    element:
      id: "medicationListCard"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "medicationListCard"
- extendedWaitUntil:
    visible:
        text: "Your Medications"
    timeout: 5000

# === Sub-Pages from Fragments ===

# Add Habit from Home
- tapOn: "Home"
- extendedWaitUntil:
    visible:
        id: "addHabitButton"
    timeout: 5000
- tapOn:
    id: "addHabitButton"
- extendedWaitUntil:
    visible:
        id: "habitNameInput"
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "Add Habit"
    timeout: 10000

# Add Emotion Pair from Emotions
- tapOn: "Emotions"
- extendedWaitUntil:
    visible:
        id: "addEmotionPairButton"
    timeout: 5000
- tapOn:
    id: "addEmotionPairButton"
- extendedWaitUntil:
    visible:
        text: "Add Emotion Pair"
    timeout: 5000

# Sleep Analysis from Sleep
- tapOn:
    text: "Sleep"
    index: 0
- extendedWaitUntil:
    visible:
        id: "viewAnalysisButton"
    timeout: 5000
- tapOn:
    id: "viewAnalysisButton"
- extendedWaitUntil:
    visible:
        text: "Sleep Analysis"
    timeout: 5000
# Go back from activity
- back
- extendedWaitUntil:
    visible:
        text: "Sleep Tracking"
    timeout: 5000
