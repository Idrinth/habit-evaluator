appId: de.idrinth.habitevaluator.android
name: "Add, display and delete a sport log entry"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Diary > Sport Log
- tapOn: "Diary"
- extendedWaitUntil:
    visible:
        id: "sportLogCard"
    timeout: 5000
- tapOn:
    id: "sportLogCard"

# Wait for SportLogFragment to load (toggleFormButton is unique to sport log page)
- scrollUntilVisible:
    element:
      id: "toggleFormButton"
    direction: DOWN
    timeout: 10000

# Expand add entry form
- tapOn:
    id: "toggleFormButton"

# Wait for form to render before scrolling
- extendedWaitUntil:
    visible:
        id: "activityNameInput"
    timeout: 5000

# Fill activity name (required)
- scrollUntilVisible:
    element:
      id: "activityNameInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "activityNameInput"
- inputText: "Running"
- hideKeyboard

# Fill measurement (required)
- scrollUntilVisible:
    element:
      id: "measurementInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "measurementInput"
- inputText: "5.0"
- hideKeyboard

# Fill measurement unit (required)
- tapOn:
    id: "measurementUnitInput"
- inputText: "km"
- hideKeyboard

# Date auto-fills with today
# Set start time via picker (field is not directly editable)
- scrollUntilVisible:
    element:
      id: "sportStartTimeInput"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "sportStartTimeInput"
- tapOn: "OK"

# Set end time via picker
- tapOn:
    id: "sportEndTimeInput"
- tapOn: "OK"

# Scroll to and tap submit button
- scrollUntilVisible:
    element:
      id: "addSportLogButton"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "addSportLogButton"

# Verify entry appears in the list
- scrollUntilVisible:
    element:
      text: "Running"
    direction: DOWN
    timeout: 5000
- assertVisible: "Running"

# Delete the entry
- tapOn:
    id: "sportLogDeleteButton"

# Verify entry is removed
- assertNotVisible:
    id: "sportLogDeleteButton"
