appId: de.idrinth.habitevaluator.android
name: "Imprint page renders all sections"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Imprint
- tapOn:
    id: "imprintButton"

# Verify content sections
- assertVisible: "Project legal"

- scrollUntilVisible:
    element:
      text: "Contact"
    direction: DOWN
    timeout: 5000
- assertVisible: "Contact"

- scrollUntilVisible:
    element:
      text: "License"
    direction: DOWN
    timeout: 5000
- assertVisible: "License"

- scrollUntilVisible:
    element:
      text: "Data Protection"
    direction: DOWN
    timeout: 5000
- assertVisible: "Data Protection"

- scrollUntilVisible:
    element:
      text: "Disclaimers"
    direction: DOWN
    timeout: 5000
- assertVisible: "Disclaimers"

- scrollUntilVisible:
    element:
      text: "Third-Party Libraries"
    direction: DOWN
    timeout: 5000
- assertVisible: "Third-Party Libraries"
