appId: de.idrinth.habitevaluator.android
name: "Add Emotion Pair page is reachable"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Emotions tab
- tapOn: "Emotions"
- extendedWaitUntil:
    visible:
        id: "emotionalStateTitle"
    timeout: 5000

# Tap add emotion pair button
- tapOn:
    id: "addEmotionPairButton"
- extendedWaitUntil:
    visible:
        text: "Add Emotion Pair"
    timeout: 5000
