appId: de.idrinth.habitevaluator.android
name: "Sleep Tracking page renders all elements"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Sleep tab
- tapOn:
    text: "Sleep"
    index: 0

# Verify page content
- assertVisible: "Sleep Tracking"
- assertVisible:
    id: "sleepDateInput"
- assertVisible:
    id: "sleepFromInput"
- assertVisible:
    id: "sleepUntilInput"
- assertVisible:
    id: "addSleepEntryButton"

# Verify stats sections
- scrollUntilVisible:
    element:
      text: "Weekly Sleep Stats"
    direction: DOWN
    timeout: 5000
- assertVisible: "Weekly Sleep Stats"

- scrollUntilVisible:
    element:
      text: "Monthly Sleep Stats"
    direction: DOWN
    timeout: 5000
- assertVisible: "Monthly Sleep Stats"

- scrollUntilVisible:
    element:
      text: "Recent Entries"
    direction: DOWN
    timeout: 5000
- assertVisible: "Recent Entries"
