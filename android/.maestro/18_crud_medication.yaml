appId: de.idrinth.habitevaluator.android
name: "Add, display and delete a medication"
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Habit Evaluator"
- tapOn: "I understand"

# Navigate to Diary > Medication List
- tapOn: "Diary"
- scrollUntilVisible:
    element:
      id: "medicationListCard"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "medicationListCard"

# Wait for MedicationListFragment to load (unique element not on diary nav)
- scrollUntilVisible:
    element:
      id: "newMedicationNameInput"
    direction: DOWN
    timeout: 10000

# Fill medication name (required)
- tapOn:
    id: "newMedicationNameInput"
- inputText: "Aspirin"
- hideKeyboard

# Provision type defaults to first option (Pill)
# Scroll to and tap submit button
- scrollUntilVisible:
    element:
      id: "addMedicationButton"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "addMedicationButton"

# Verify medication appears in the list
- scrollUntilVisible:
    element:
      text: "Aspirin"
    direction: DOWN
    timeout: 5000
- assertVisible: "Aspirin"

# Delete the medication
- tapOn:
    id: "deleteMedicationButton"

# Verify medication is removed
- assertNotVisible: "Aspirin"
