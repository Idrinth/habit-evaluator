# Server configuration
server.port=8080

# Application name
spring.application.name=habit-evaluator

# Thymeleaf configuration
spring.thymeleaf.cache=false

# Logging
logging.level.de.idrinth.habitevaluator=DEBUG

# Default database configuration (H2 for local development)
spring.datasource.url=jdbc:h2:file:./data/habit-evaluator;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize default categories and habits for new users on startup
app.init-default-data=false
