# MariaDB/MySQL configuration for remote webserver mode
# Activate this profile with: --spring.profiles.active=mariadb

# Database connection (configure via environment variables for production)
spring.datasource.url=${MARIADB_URL:jdbc:mariadb://localhost:3306/habit_evaluator}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${MARIADB_USERNAME:habit_user}
spring.datasource.password=${MARIADB_PASSWORD:}

# JPA/Hibernate configuration for MariaDB
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# Disable H2 console in production
spring.h2.console.enabled=false
