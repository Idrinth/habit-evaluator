<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Evaluator - Add Scoring Rule</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.25rem;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="number"] {
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            padding: 0.6rem;
            background-color: #4a90d9;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background-color: #357abd;
        }
        .error {
            color: #d9534f;
            text-align: center;
            margin-bottom: 1rem;
        }
        .success {
            color: #5cb85c;
            text-align: center;
            margin-bottom: 1rem;
        }
        .hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: -0.75rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Scoring Rule</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${success}" th:text="${success}"></p>
        <form action="/score-rules/add" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="thresholdFor1Point">Threshold for 1 Point</label>
            <input type="number" id="thresholdFor1Point" name="thresholdFor1Point" min="0" value="1" required>
            <p class="hint">Minimum weekly completions to earn 1 point</p>

            <label for="thresholdFor2Points">Threshold for 2 Points</label>
            <input type="number" id="thresholdFor2Points" name="thresholdFor2Points" min="0" value="2" required>
            <p class="hint">Minimum weekly completions to earn 2 points</p>

            <label for="thresholdFor4Points">Threshold for 4 Points</label>
            <input type="number" id="thresholdFor4Points" name="thresholdFor4Points" min="0" value="4" required>
            <p class="hint">Minimum weekly completions to earn 4 points</p>

            <label for="thresholdFor8Points">Threshold for 8 Points</label>
            <input type="number" id="thresholdFor8Points" name="thresholdFor8Points" min="0" value="7" required>
            <p class="hint">Minimum weekly completions to earn 8 points</p>

            <button type="submit">Create Scoring Rule</button>
        </form>
    </div>
</body>
</html>
