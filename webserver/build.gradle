plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    implementation project(':shared')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Database abstraction layer - Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // H2 database for local/development mode
    runtimeOnly 'com.h2database:h2:2.2.224'

    // MariaDB/MySQL driver for production/webserver mode
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.3.2'

    // PDF generation
    implementation 'com.github.librepdf:openpdf:1.3.35'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // OpenAPI specification generation (test-time only)
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.0.1'
}

test {
    systemProperty 'openapi.output.dir', projectDir.toString()
}

bootJar {
    archiveBaseName = 'habit-evaluator-web'
    archiveVersion = ''
}
