plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    implementation project(':shared')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Database abstraction layer - Spring Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // H2 database for local/development mode
    runtimeOnly 'com.h2database:h2:2.2.224'

    // MariaDB/MySQL driver for production/webserver mode
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.7'

    // PDF generation
    implementation 'com.github.librepdf:openpdf:3.0.3'

    // Development tools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // OpenAPI specification generation (test-time only)
    testImplementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.8.6'
}

test {
    systemProperty 'openapi.output.dir', projectDir.toString()
}

bootJar {
    archiveBaseName = 'habit-evaluator-web'
    archiveVersion = ''
}
