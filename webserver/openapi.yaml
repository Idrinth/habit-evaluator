components:
  schemas:
    ReminderSettings:
      type: object
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/User"
        sleepReminderEnabled:
          type: boolean
        sleepReminderTime:
          type: string
          example: 14:30:00
        diaryReminderEnabled:
          type: boolean
        diaryReminderTime:
          type: string
          example: 14:30:00
        emotionReminderEnabled:
          type: boolean
        emotionReminderCount:
          type: integer
          format: int32
        wakingHoursStart:
          type: string
          example: 14:30:00
        wakingHoursEnd:
          type: string
          example: 14:30:00
    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    ModuleVisibility:
      type: object
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/User"
        diaryVisible:
          type: boolean
        sleepVisible:
          type: boolean
        emotionsVisible:
          type: boolean
        pointsVisible:
          type: boolean
        statisticsVisible:
          type: boolean
        foodLogVisible:
          type: boolean
        sportLogVisible:
          type: boolean
        medicationVisible:
          type: boolean
        backupVisible:
