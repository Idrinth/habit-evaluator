plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation project(':shared')

    // Logging implementation
    implementation 'ch.qos.logback:logback-classic:1.4.14'

    // H2 database for local persistence
    implementation 'com.h2database:h2:2.2.224'

    // Hibernate for JPA implementation
    implementation 'org.hibernate.orm:hibernate-core:6.4.2.Final'

    // PDF generation
    implementation 'com.github.librepdf:openpdf:1.3.35'
}

application {
    mainClass = 'de.idrinth.habitevaluator.desktop.HabitEvaluatorDesktopApp'
    mainModule = 'de.idrinth.habitevaluator.desktop'
}

jar {
    manifest {
        attributes(
            'Main-Class': 'de.idrinth.habitevaluator.desktop.HabitEvaluatorDesktopApp'
        )
    }
}

tasks.register('jpackageDeb', Exec) {
    dependsOn ':desktop:jar'
    group = 'distribution'
    description = 'Creates a .deb package using jpackage'

    def outputDir = layout.buildDirectory.dir('jpackage-deb').get().asFile
    def jarDir = layout.buildDirectory.dir('libs').get().asFile
    def jarFile = layout.buildDirectory.file("libs/${project.name}-${project.version}.jar").get().asFile

    doFirst {
        outputDir.mkdirs()
    }

    commandLine 'jpackage',
        '--input', jarDir.absolutePath,
        '--main-jar', jarFile.name,
        '--main-class', 'de.idrinth.habitevaluator.desktop.HabitEvaluatorDesktopApp',
        '--name', 'HabitEvaluator',
        '--app-version', project.version.toString().replace('-SNAPSHOT', ''),
        '--dest', outputDir.absolutePath,
        '--type', 'deb',
        '--linux-shortcut',
        '--linux-app-category', 'Utility'
}

tasks.register('jpackageExe', Exec) {
    dependsOn ':desktop:jar'
    group = 'distribution'
    description = 'Creates a .exe installer using jpackage'

    def outputDir = layout.buildDirectory.dir('jpackage-exe').get().asFile
    def jarDir = layout.buildDirectory.dir('libs').get().asFile
    def jarFile = layout.buildDirectory.file("libs/${project.name}-${project.version}.jar").get().asFile

    doFirst {
        outputDir.mkdirs()
    }

    commandLine 'jpackage',
        '--input', jarDir.absolutePath,
        '--main-jar', jarFile.name,
        '--main-class', 'de.idrinth.habitevaluator.desktop.HabitEvaluatorDesktopApp',
        '--name', 'HabitEvaluator',
        '--app-version', project.version.toString().replace('-SNAPSHOT', ''),
        '--dest', outputDir.absolutePath,
        '--type', 'exe',
        '--win-shortcut',
        '--win-menu',
        '--win-menu-group', 'Habit Evaluator'
}
