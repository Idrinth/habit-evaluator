plugins {
    id 'java'
    id 'idea'
    id 'jacoco'
}

allprojects {
    group = 'de.idrinth.habitevaluator'
    version = findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT'
}

subprojects {
    repositories {
        mavenCentral()
        google()
    }

    afterEvaluate {
        if (plugins.hasPlugin('java') || plugins.hasPlugin('java-library')) {
            apply plugin: 'jacoco'

            java {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            test {
                useJUnitPlatform()
                finalizedBy jacocoTestReport
            }

            jacoco {
                toolVersion = '0.8.11'
            }

            jacocoTestReport {
                dependsOn test
                reports {
                    xml.required = true
                    html.required = true
                    csv.required = false
                }
            }

            jacocoTestCoverageVerification {
                violationRules {
                    rule {
                        limit {
                            minimum = 0.0
                        }
                    }
                }
            }

            dependencies {
                testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
                testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
            }
        }
    }
}
