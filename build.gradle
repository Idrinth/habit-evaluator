plugins {
    id 'java'
    id 'idea'
    id 'jacoco'
}

allprojects {
    group = 'de.idrinth.habitevaluator'
    version = findProperty('releaseVersion') ?: '0.1.0-SNAPSHOT'
}

subprojects {
    repositories {
        mavenCentral()
        google()
    }

    pluginManager.withPlugin('java') {
        apply plugin: 'jacoco'

        java {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }

        test {
            useJUnitPlatform()
            finalizedBy jacocoTestReport
            outputs.cacheIf { false }
            systemProperty 'junit.jupiter.execution.timeout.default', '5m'
        }

        jacoco {
            toolVersion = '0.8.13'
        }

        jacocoTestReport {
            dependsOn test
            reports {
                xml.required = true
                html.required = true
                csv.required = false
            }
        }

        jacocoTestCoverageVerification {
            violationRules {
                rule {
                    limit {
                        minimum = 0.0
                    }
                }
            }
        }

        dependencies {
            testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
    }
}

def javaModules = [':shared', ':webserver', ':desktop']

tasks.register('jacocoAggregateReport', JacocoReport) {
    description = 'Generates an aggregate JaCoCo coverage report for all Java modules.'
    group = 'verification'

    dependsOn javaModules.collect { "${it}:test" }

    additionalClassDirs(files(javaModules.collect { modulePath ->
        project(modulePath).sourceSets.main.output
    }))
    additionalSourceDirs(files(javaModules.collect { modulePath ->
        project(modulePath).sourceSets.main.allSource.srcDirs
    }))
    executionData(files(javaModules.collect { modulePath ->
        project(modulePath).tasks.named('test').map { it.jacoco.destinationFile }
    }))

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
