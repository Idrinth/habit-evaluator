plugins {
    id 'java-library'
}

dependencies {
    // JSON processing
    api 'com.google.code.gson:gson:2.10.1'

    // Logging
    api 'org.slf4j:slf4j-api:2.0.11'

    // YAML processing for localization
    api 'org.yaml:snakeyaml:2.2'

    // JPA API for entity annotations (implementation provided by runtime)
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // Jackson annotations for JSON serialization control (implementation provided by runtime)
    compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.16.1'
}
