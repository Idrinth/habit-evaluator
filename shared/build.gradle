plugins {
    id 'java-library'
}

dependencies {
    // JSON processing
    api 'com.google.code.gson:gson:2.10.1'

    // Logging
    api 'org.slf4j:slf4j-api:2.0.11'

    // JPA API for entity annotations (implementation provided by runtime)
    compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
}
