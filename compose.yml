services:
  database:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-habit-evaluator}
      MARIADB_DATABASE: habit_evaluator
      MARIADB_USER: ${MARIADB_USERNAME:-habit-evaluator}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-habit-evaluator}
    volumes:
      - database:/var/lib/mysql

  webserver:
    build:
      context: .
      dockerfile: webserver/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      MARIADB_URL: jdbc:mariadb://database:3306/habit_evaluator
      MARIADB_USERNAME: ${MARIADB_USERNAME:-habit-evaluator}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-habit-evaluator}
    depends_on:
      - database

  homepage:
    build:
      context: homepage
      dockerfile: Dockerfile
    ports:
      - "${HOMEPAGE_PORT:-8081}:80"

  website:
    build:
      context: website
      dockerfile: Dockerfile
    environment:
      # API base URL - defaults to /api (proxied to webserver via nginx)
      # Override to point to a different API server, e.g., https://api.example.com
      API_BASE_URL: ${API_BASE_URL:-/api}
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "${WEBSITE_PORT:-8080}:80"
    depends_on:
      - webserver

configs:
  nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          index index.html;

          location /api/ {
              proxy_pass http://webserver:8080;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
          }

          location / {
              try_files $$uri $$uri/ /index.html;
          }
      }

volumes:
  database:
