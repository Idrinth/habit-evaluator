name: Validate Semver Label

on:
  pull_request:
    branches: [the-one]
    types: [opened, labeled, unlabeled, synchronize]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check semver labels
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
        run: |
          SEMVER_LABELS=$(printf '%b\n' "$LABELS" | grep -c '^semver:' || true)
          if [ "$SEMVER_LABELS" -eq 0 ]; then
            echo "::error::No semver: label found. Please add exactly one semver: label to this PR."
            exit 1
          fi
          if [ "$SEMVER_LABELS" -gt 1 ]; then
            echo "::error::Multiple semver: labels found ($SEMVER_LABELS). Please keep exactly one semver: label on this PR."
            exit 1
          fi
          LABEL_NAME=$(printf '%b\n' "$LABELS" | grep '^semver:')
          echo "Found semver label: $LABEL_NAME"
