name: CI

on:
  push:
    branches:
    - the-one
  pull_request:
    branches:
    - the-one

permissions:
  contents: read
  packages: write

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew :shared:build :webserver:build :desktop:build

      - name: Generate coverage reports
        run: ./gradlew :shared:jacocoTestReport :webserver:jacocoTestReport :desktop:jacocoTestReport
        if: always()

      - name: Generate aggregate coverage report
        run: ./gradlew jacocoAggregateReport
        if: always()

      - name: Verify coverage thresholds
        run: ./gradlew jacocoTestCoverageVerification
        if: always()

      - name: Upload shared coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-coverage-report
          path: shared/build/reports/jacoco/

      - name: Upload webserver coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: webserver-coverage-report
          path: webserver/build/reports/jacoco/

      - name: Upload desktop coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-coverage-report
          path: desktop/build/reports/jacoco/

      - name: Upload aggregate coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: aggregate-coverage-report
          path: build/reports/jacoco/

      - name: Upload webserver JAR
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: webserver-jar
          path: webserver/build/libs/habit-evaluator-web.jar

      - name: Upload desktop JAR
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: habit-evaluator-desktop
          path: desktop/build/libs/*.jar

      - name: Coveralls - shared
        uses: coverallsapp/github-action@v2
        with:
          flag-name: shared
          parallel: true
          format: jacoco
          file: shared/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Coveralls - webserver
        uses: coverallsapp/github-action@v2
        with:
          flag-name: webserver
          parallel: true
          format: jacoco
          file: webserver/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Coveralls - desktop
        uses: coverallsapp/github-action@v2
        with:
          flag-name: desktop
          parallel: true
          format: jacoco
          file: desktop/build/reports/jacoco/test/jacocoTestReport.xml

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APKs and run tests
        run: >
          ./gradlew
          :android:assembleModernDebug
          :android:assembleLegacyDebug
          :android:testModernDebugUnitTest
          :android:testLegacyDebugUnitTest

      - name: Generate coverage report
        run: ./gradlew :android:jacocoTestReport
        if: always()

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-coverage-report
          path: android/build/reports/jacoco/

      - name: Coveralls - android
        uses: coverallsapp/github-action@v2
        with:
          flag-name: android
          parallel: true
          format: jacoco
          file: android/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

  frontend-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [homepage, website]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  website-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: website-coverage-report
          path: website/coverage/

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          flag-name: website
          parallel: true
          file: website/coverage/lcov.info

  e2e:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [homepage, website]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Cypress E2E tests
        run: npx start-server-and-test 'npm run preview' http://localhost:4173 'npx cypress run'

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-build
          path: ${{ matrix.project }}/build/

  coveralls-finish:
    needs: [java, android, website-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "shared,webserver,desktop,android,website"

  desktop-deb:
    needs: java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build desktop .deb
        run: ./gradlew :desktop:jpackageDeb

      - name: Upload desktop .deb
        uses: actions/upload-artifact@v6
        with:
          name: habit-evaluator-desktop-deb
          path: desktop/build/jpackage-deb/*.deb

  desktop-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build desktop .exe
        run: ./gradlew :desktop:jpackageExe

      - name: Upload desktop .exe
        uses: actions/upload-artifact@v6
        with:
          name: habit-evaluator-desktop-exe
          path: desktop/build/jpackage-exe/*.exe

  check-signing:
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - name: Check for signing secrets
        id: check
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  android-release:
    runs-on: ubuntu-latest
    needs: [android, check-signing]
    if: needs.check-signing.outputs.has-secrets == 'true'
    strategy:
      matrix:
        flavor: [modern, legacy]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

      - name: Build signed APK and AAB (${{ matrix.flavor }})
        env:
          ANDROID_KEYSTORE_FILE: /tmp/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: >
          ./gradlew
          :android:assemble${{ matrix.flavor == 'modern' && 'Modern' || 'Legacy' }}Release
          :android:bundle${{ matrix.flavor == 'modern' && 'Modern' || 'Legacy' }}Release

      - name: Upload APK (${{ matrix.flavor }})
        uses: actions/upload-artifact@v6
        with:
          name: habit-evaluator-android-${{ matrix.flavor }}
          path: android/build/outputs/apk/${{ matrix.flavor }}Release/*.apk

      - name: Upload AAB (${{ matrix.flavor }})
        uses: actions/upload-artifact@v6
        with:
          name: habit-evaluator-android-${{ matrix.flavor }}-aab
          path: android/build/outputs/bundle/${{ matrix.flavor }}Release/*.aab

  docker:
    if: github.event_name == 'push'
    needs: [java, e2e, frontend-check, website-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: webserver
            context: .
            dockerfile: webserver/Dockerfile
            artifact: webserver-jar
            artifact-path: webserver/build/libs/
          - image: website
            context: website
            dockerfile: website/Dockerfile
            artifact: website-build
            artifact-path: website/build/
          - image: homepage
            context: homepage
            dockerfile: homepage/Dockerfile
            artifact: homepage-build
            artifact-path: homepage/build/
    steps:
      - uses: actions/checkout@v6

      - name: Download pre-built artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}

      - name: Lowercase repository
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prebuilt
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo_lc }}/${{ matrix.image }}:latest
