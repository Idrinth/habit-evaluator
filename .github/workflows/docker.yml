name: Docker

on:
  push:
    branches:
      - the-one
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: webserver
            context: .
            dockerfile: webserver/Dockerfile
          - image: website
            context: website
            dockerfile: website/Dockerfile
          - image: homepage
            context: homepage
            dockerfile: homepage/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'release'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repo_lc }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ github.event_name == 'release' && steps.meta.outputs.tags || format('ghcr.io/{0}/{1}:latest', steps.repo.outputs.repo_lc, matrix.image) }}
          labels: ${{ steps.meta.outputs.labels }}
