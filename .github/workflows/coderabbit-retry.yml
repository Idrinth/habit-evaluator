name: CodeRabbit Retry
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  pull-requests: write
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Retry CodeRabbit Reviews
        uses: idrinth/coderabbit-retry-action@1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}