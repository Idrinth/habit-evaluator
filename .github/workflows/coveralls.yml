name: Coveralls

on:
  push:
    branches:
    - the-one
  pull_request:
    branches:
    - the-one

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build

      - name: Generate coverage reports
        run: ./gradlew jacocoTestReport

      - name: Coveralls - shared
        uses: coverallsapp/github-action@v2
        with:
          flag-name: shared
          parallel: true
          format: jacoco
          file: shared/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Coveralls - webserver
        uses: coverallsapp/github-action@v2
        with:
          flag-name: webserver
          parallel: true
          format: jacoco
          file: webserver/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Coveralls - desktop
        uses: coverallsapp/github-action@v2
        with:
          flag-name: desktop
          parallel: true
          format: jacoco
          file: desktop/build/reports/jacoco/test/jacocoTestReport.xml

  website:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          flag-name: website
          parallel: true
          file: website/coverage/lcov.info

  finish:
    needs: [java, website]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: "shared,webserver,desktop,website"
