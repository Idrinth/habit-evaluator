name: Release

on:
  release:
    types:
      - published

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build webserver and desktop JARs
        run: ./gradlew :webserver:bootJar :desktop:jar "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build desktop .deb
        run: ./gradlew :desktop:jpackageDeb "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Upload webserver JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: webserver-jar
          path: webserver/build/libs/habit-evaluator-web.jar

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: |
            webserver/build/libs/habit-evaluator-web*.jar
            desktop/build/libs/*.jar
            desktop/build/jpackage-deb/*.deb

  artifacts-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build desktop .exe
        shell: bash
        run: ./gradlew :desktop:jpackageExe "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: desktop/build/jpackage-exe/*.exe

  artifacts-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [lollipop, oreo, tiramisu]
        include:
          - flavor: lollipop
            taskName: Lollipop
          - flavor: oreo
            taskName: Oreo
          - flavor: tiramisu
            taskName: Tiramisu
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

      - name: Build signed APK and AAB (${{ matrix.flavor }})
        env:
          ANDROID_KEYSTORE_FILE: /tmp/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: >
          ./gradlew
          :android:assemble${{ matrix.taskName }}Release
          :android:bundle${{ matrix.taskName }}Release
          "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Upload APK release assets (${{ matrix.flavor }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: android/build/outputs/apk/${{ matrix.flavor }}/release/*.apk

      - name: Upload AAB release assets (${{ matrix.flavor }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: android/build/outputs/bundle/${{ matrix.flavor }}Release/*.aab

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [website, homepage]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.project }}-build
          path: ${{ matrix.project }}/build/

  docker:
    needs: [artifacts, frontend-build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: webserver
            context: .
            dockerfile: webserver/Dockerfile
            artifact: webserver-jar
            artifact-path: webserver/build/libs/
          - image: website
            context: website
            dockerfile: website/Dockerfile
            artifact: website-build
            artifact-path: website/build/
          - image: homepage
            context: homepage
            dockerfile: homepage/Dockerfile
            artifact: homepage-build
            artifact-path: homepage/build/
    steps:
      - uses: actions/checkout@v6

      - name: Download pre-built artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}

      - name: Lowercase repository
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repo_lc }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
