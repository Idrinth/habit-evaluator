name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build webserver and desktop JARs
        run: ./gradlew :webserver:bootJar :desktop:jar "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build desktop .deb
        run: ./gradlew :desktop:jpackageDeb "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webserver/build/libs/habit-evaluator-web*.jar
            desktop/build/libs/*.jar
            desktop/build/jpackage-deb/*.deb

  artifacts-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build desktop .exe
        run: ./gradlew :desktop:jpackageExe "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/jpackage-exe/*.exe

  artifacts-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: /tmp/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease "-PreleaseVersion=${{ steps.version.outputs.VERSION }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: android/build/outputs/apk/release/*.apk
