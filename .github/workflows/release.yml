name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: webserver
            context: .
            dockerfile: webserver/Dockerfile
          - image: website
            context: website
            dockerfile: website/Dockerfile
          - image: homepage
            context: homepage
            dockerfile: homepage/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository
        id: repo
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repo_lc }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build webserver and desktop JARs
        run: ./gradlew :webserver:bootJar :desktop:jar

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webserver/build/libs/habit-evaluator-web*.jar
            desktop/build/libs/*.jar
