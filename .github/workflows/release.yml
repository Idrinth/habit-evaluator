name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build webserver and desktop JARs
        run: ./gradlew :webserver:bootJar :desktop:jar

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Build desktop .deb
        run: ./gradlew :desktop:jpackageDeb

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            webserver/build/libs/habit-evaluator-web*.jar
            desktop/build/libs/*.jar
            desktop/build/jpackage-deb/*.deb

  artifacts-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build desktop .exe
        run: ./gradlew :desktop:jpackageExe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/jpackage-exe/*.exe
