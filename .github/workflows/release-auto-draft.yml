name: Release Auto-Draft

on:
  push:
    branches:
      - the-one

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "v${{ steps.version.outputs.next_version }}" \
            --generate-notes \
            --target the-one || \
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "v${{ steps.version.outputs.next_version }}" \
            --notes "" \
            --target the-one

      - name: Delete older draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read -r TAG; do
            if [ "$TAG" != "${{ steps.version.outputs.tag }}" ]; then
              gh release delete "$TAG" --yes --cleanup-tag || gh release delete "$TAG" --yes
            fi
          done
