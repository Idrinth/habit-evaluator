name: Release Auto-Draft

on:
  push:
    branches:
      - the-one

permissions:
  contents: write
concurrency:
  group: release-draft
  cancel-in-progress: false
jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="0.1.0"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            TAG_DATE=$(git for-each-ref --format='%(taggerdate:iso8601-strict)' "refs/tags/$LATEST_TAG")
            if [ -z "$TAG_DATE" ]; then
              TAG_DATE=$(git log -1 --format=%cI "$LATEST_TAG")
            fi
            LABELS=$(gh pr list --state merged --search "merged:>=${TAG_DATE}" --limit 200 --json labels --jq '.[].labels[].name' 2>/dev/null || echo "")

            if echo "$LABELS" | grep -q '^semver:major$'; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$LABELS" | grep -q '^semver:minor$'; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi

            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Delete old draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read -r TAG; do
            gh release delete "$TAG" --yes --cleanup-tag || gh release delete "$TAG" --yes
          done

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "v${{ steps.version.outputs.next_version }}" \
            --generate-notes \
            --target the-one || \
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "v${{ steps.version.outputs.next_version }}" \
            --notes "" \
            --target the-one
